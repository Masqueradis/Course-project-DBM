services:
  php:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
      target: dev
    container_name: ${PROJECT_NAME}_php
    volumes:
      - ../src:/var/www/html:cached
    networks:
      - ${PROJECT_NAME}

  nginx:
    image: nginx:1.27-alpine
    container_name: ${PROJECT_NAME}_nginx
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ../src:/var/www/html:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - ${PROJECT_NAME}

networks:
  sandbox:
    driver: bridge